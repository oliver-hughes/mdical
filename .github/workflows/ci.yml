name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install luajit
        run: sudo apt-get update && sudo apt-get install -y luajit

      # The core has no `vim` dependency, so the suite needs no neovim - and
      # running under bare luajit is what enforces that: an accidental
      # `vim.trim` in lua/mdical/ fails here.
      - name: test
        run: luajit tests/run.lua

      - name: check the core stays free of nvim api calls
        run: |
          if grep -rn --include='*.lua' '\bvim\.' lua/mdical --exclude-dir=nvim; then
            echo "the shared core must not use the nvim api - it runs under plain luajit on the server"
            exit 1
          fi

      # The nightly run is shell and cannot be unit tested, so this is the only
      # automated opinion there is about it. It already caught a sudo redirect
      # writing a root-owned file and an `A && B || C` in the push-failure path.
      - name: shellcheck the server scripts
        run: |
          sudo apt-get install -y shellcheck
          shellcheck server/*.sh

  nvim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install neovim
        run: sudo apt-get update && sudo apt-get install -y neovim

      # The editor layer: diagnostics, autocmds and the picker callbacks, with
      # vim.ui stubbed. Unit tests can't reach any of it.
      - name: smoke test
        run: nvim --headless --clean -l tests/nvim_smoke.lua
